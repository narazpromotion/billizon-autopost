name: Post to Instagram

on:
  schedule:
    # Mon, Wed, Fri at 17:10 UTC. That is 10:10 Vancouver in PDT and
    # 09:10 in PST. The odd minute is deliberate: GitHub's scheduler is
    # busiest on the hour and delays runs queued at :00.
    - cron: "10 17 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and show the caption without publishing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never let two runs publish at once.
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish next queued post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/post.py

      - name: Record the post in the queue
        if: ${{ inputs.dry_run != true }}
        run: |
          if [[ -n "$(git status --porcelain posts/queue.json)" ]]; then
            git config user.name "billizon-autopost"
            git config user.email "actions@github.com"
            git add posts/queue.json
            git commit -m "Posted to Instagram [skip ci]"
            git push
          else
            echo "Queue unchanged, nothing to commit."
          fi
